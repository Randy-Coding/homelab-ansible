---
# During a first-install dry run, the package task only predicts installation.
- name: Check whether Samba account tools are installed
  ansible.builtin.stat:
    path: /usr/bin/pdbedit
  register: samba_pdbedit

- name: Read existing Samba accounts
  ansible.builtin.command:
    argv: [pdbedit, --list]
  register: samba_existing_accounts
  changed_when: false
  check_mode: false
  when: samba_pdbedit.stat.exists or not ansible_check_mode

- name: Require stored passwords for Samba accounts (run make vault-setup)
  ansible.builtin.assert:
    that:
      - samba_accounts | difference((vault_samba_passwords | default({})).keys() | list) | length == 0
    fail_msg: "Run make vault-setup to generate missing encrypted Samba passwords."

- name: Report missing Samba credentials in check mode
  ansible.builtin.debug:
    msg: "Would create Samba credentials for {{ item }} from Vault."
  loop: "{{ samba_accounts | difference(samba_existing_accounts.stdout_lines | default([]) | map('split', ':') | map('first') | list) }}"
  changed_when: true
  when: ansible_check_mode

- name: Create missing Samba credentials from Vault
  ansible.builtin.command:
    argv: [smbpasswd, -s, -a, "{{ item }}"]
    stdin: "{{ vault_samba_passwords[item] }}\n{{ vault_samba_passwords[item] }}"
  loop: "{{ samba_accounts }}"
  vars:
    samba_existing_names: >-
      {{ samba_existing_accounts.stdout_lines | default([])
         | map('split', ':') | map('first') | list }}
  when:
    - not ansible_check_mode
    - item not in samba_existing_names
  changed_when: true
  no_log: true
