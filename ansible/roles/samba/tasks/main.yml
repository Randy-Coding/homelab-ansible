---
# The upstream credential task interpolates passwords into a shell command.
# Restrict its input to the agreed alphanumeric password policy.
- name: Validate Samba accounts and Vault passwords (nonempty alphanumeric only)
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z_][a-z0-9_-]*\Z')
      - item.password is string
      - item.password is match('^[A-Za-z0-9]+\Z')
  loop: "{{ samba_users }}"
  no_log: true

- name: Validate explicit Samba share access
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.valid_users is defined
      - item.valid_users is string
      - item.valid_users | length > 0
    fail_msg: "Each share needs a name and valid_users as a Samba user/group string."
  loop: "{{ samba_shares }}"

- name: Create Samba group
  ansible.builtin.group:
    name: "{{ samba_group }}"
    state: present

- name: Read existing Linux accounts
  ansible.builtin.getent:
    database: passwd

- name: Ensure NAS accounts exist and belong to the Samba group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ samba_group }}"
    append: true
    create_home: false
    shell: >-
      {{ omit if item in ansible_facts.getent_passwd else '/sbin/nologin' }}
    state: present
  loop: "{{ samba_users | map(attribute='name') | list }}"

- name: Manage Samba with the community collection
  ansible.builtin.include_role:
    name: vladgh.samba.server

- name: Allow Samba through firewall
  ansible.posix.firewalld:
    service: samba
    zone: "{{ samba_firewall_zone }}"
    state: enabled
    permanent: true
    immediate: true
