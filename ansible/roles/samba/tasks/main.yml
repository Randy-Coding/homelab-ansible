---
- name: Validate Samba share configuration
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.path is defined
      - item.valid_users is defined
      - item.valid_users | length > 0
    fail_msg: "Each Samba share needs a name, path, and nonempty valid_users list."
  loop: "{{ samba_shares }}"

- name: Install Samba
  ansible.builtin.dnf:
    name:
      - samba
      - samba-common-tools
    state: present

- name: Configure Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/testparm -s %s
  notify: Restart Samba

- name: Enable and start Samba
  ansible.builtin.systemd_service:
    name: smb
    enabled: true
    state: started

- name: Allow samba through firewall
  ansible.posix.firewalld:
    service: samba
    zone: "{{ samba_firewall_zone }}"
    state: enabled
    permanent: true
    immediate: true

- name: Create Samba group
  ansible.builtin.group:
    name: "{{ samba_group }}"
    state: present

- name: Read existing Linux accounts
  ansible.builtin.getent:
    database: passwd

- name: Ensure NAS accounts exist and belong to the Samba group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ samba_group }}"
    append: true
    create_home: false
    shell: >-
      {{ omit if item in ansible_facts.getent_passwd else '/sbin/nologin' }}
    state: present
  loop: "{{ samba_accounts }}"

- name: Set up missing Samba credentials
  ansible.builtin.import_tasks: credentials.yml
