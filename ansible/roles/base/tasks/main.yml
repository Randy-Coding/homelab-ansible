- name: Install baseline system utilities
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - rsync
      - ca-certificates
      - tar
      - make
    state: present

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
