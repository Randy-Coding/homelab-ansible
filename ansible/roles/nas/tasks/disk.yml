---
- name: Require NAS disk configuration
  ansible.builtin.assert:
    that:
      - nas_disk_device is defined
      - nas_disk_serial is defined
      - nas_disk_size_bytes is defined
    fail_msg: "Set nas_disk_device, nas_disk_serial, and nas_disk_size_bytes."

- name: Require a persistent whole-disk path
  ansible.builtin.assert:
    that:
      - nas_disk_device is match('^/dev/disk/by-id/[^/]+$')
      - nas_disk_device is not search('-part[0-9]+$')
    fail_msg: "nas_disk_device must name a whole disk under /dev/disk/by-id/."

- name: Read NAS disk identity
  ansible.builtin.command:
    argv:
      - lsblk
      - --json
      - --bytes
      - --nodeps
      - --output
      - SIZE,SERIAL,TYPE
      - "{{ nas_disk_device }}"
  register: nas_identity
  changed_when: false
  check_mode: false

- name: Verify NAS disk identity
  ansible.builtin.assert:
    that:
      - disks | length == 1
      - disks[0].size | int == nas_disk_size_bytes | int
      - disks[0].serial == nas_disk_serial
      - disks[0].type == 'disk'
    fail_msg: >-
      Expected {{ nas_disk_device }} to be a disk with serial {{ nas_disk_serial }}
      and size {{ nas_disk_size_bytes }} bytes; observed {{ nas_identity.stdout }}.
  vars:
    disks: "{{ (nas_identity.stdout | from_json).blockdevices }}"

# Safe mode permits creating filesystems on blank disks. Require initialization
# explicitly instead of letting an ordinary run initialize a replacement disk.
- name: Require existing XFS storage during normal runs
  when: not nas_initialize | bool
  block:
    - name: Read NAS filesystem type
      ansible.builtin.command:
        argv: [blkid, -p, -o, value, -s, TYPE, "{{ nas_disk_device }}"]
      register: nas_filesystem
      changed_when: false
      check_mode: false
      failed_when: nas_filesystem.rc not in [0, 2]

    - name: Verify NAS filesystem
      ansible.builtin.assert:
        that:
          - nas_filesystem.stdout | trim == 'xfs'
        fail_msg: >-
          Expected whole-disk XFS on {{ nas_disk_device }}; observed
          {{ nas_filesystem.stdout | trim | default('no recognized filesystem', true) }}.
          To ERASE this disk and initialize it, run make nas-initialize.
