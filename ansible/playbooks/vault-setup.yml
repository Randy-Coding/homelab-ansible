---
- name: Prepare local Vault secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../inventory/host_vars/homelab/main.yml
  vars:
    vault_file: "{{ playbook_dir }}/../inventory/host_vars/homelab/vault.yml"
    vault_password_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab/vault-password"
    vault_key_path: "{{ vault_password_file | expanduser | realpath }}"
    vault_cli: "{{ ansible_playbook_python | dirname }}/ansible-vault"

  tasks:
    - name: Keep the Vault key outside the repository
      ansible.builtin.assert:
        that:
          - not vault_key_path.startswith((playbook_dir | dirname | dirname) + '/')
        fail_msg: "The Vault password file must be outside this repository."

    - name: Inspect encrypted Vault file
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: vault_state

    - name: Inspect local Vault key
      ansible.builtin.stat:
        path: "{{ vault_key_path }}"
      register: vault_key_state

    - name: Require the original key for an existing Vault
      ansible.builtin.assert:
        that:
          - not vault_state.stat.exists or vault_key_state.stat.exists
        fail_msg: "Restore the Vault key from your password manager to {{ vault_key_path }}. An existing Vault cannot be unlocked with a new key."

    - name: Create private Vault key directory
      ansible.builtin.file:
        path: "{{ vault_key_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate a local Vault key only if missing
      ansible.builtin.copy:
        dest: "{{ vault_key_path }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}\n"
        mode: "0600"
        force: false
      no_log: true

    - name: Read existing encrypted secrets
      ansible.builtin.command:
        argv: ["{{ vault_cli }}", view, --vault-password-file, "{{ vault_key_path }}", "{{ vault_file }}"]
      register: vault_existing
      changed_when: false
      no_log: true
      when: vault_state.stat.exists

    - name: Preserve existing Vault contents
      ansible.builtin.set_fact:
        vault_data: "{{ (vault_existing.stdout | from_yaml) if vault_state.stat.exists else {} }}"
      no_log: true

    - name: Generate only missing Samba passwords
      ansible.builtin.set_fact:
        vault_data: >-
          {{ vault_data | combine({'vault_samba_passwords':
             (vault_data.vault_samba_passwords | default({})) | combine({item:
             lookup('ansible.builtin.password', '/dev/null', length=32,
                    chars=['ascii_letters', 'digits'])})}) }}
      loop: "{{ samba_accounts | difference((vault_data.vault_samba_passwords | default({})).keys() | list) }}"
      register: vault_generated
      changed_when: true
      no_log: true

    - name: Save updated secrets directly as encrypted Vault content
      ansible.builtin.command:
        argv: ["{{ vault_cli }}", encrypt, --vault-password-file, "{{ vault_key_path }}", --output, "{{ vault_file }}", '-']
        stdin: "{{ vault_data | to_nice_yaml }}"
      when: not vault_state.stat.exists or vault_generated is changed
      changed_when: true
      no_log: true
